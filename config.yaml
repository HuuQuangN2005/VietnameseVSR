model:
  attention_dim: 256
  attention_heads: 4
  linear_units: 1024
  num_blocks: 8
  dropout_rate: 0.1
  attention_dropout_rate: 0.0
  cnn_module_kernel: 31

refiner:
  d_model: 256
  num_heads: 4
  ffn_dim: 1024
  num_blocks: 1
  dropout_rate: 0.1
  positional_dropout_rate: 0.1
  attention_dropout_rate: 0.0
  corruption_rate: 0.1
  corruption_sample_probability: 0.5
  top1_suppression: 0.25
  frame_weight: 1.0

training:
  seed: 42
  batch_size: 12
  num_workers: 4
  gradient_accumulation_steps: 2
  learning_rate: 0.0001
  weight_decay: 0.005
  warmup_ratio: 0.05
  max_grad_norm: 5.0
  logging_steps: 25
  save_total_limit: 3
  early_stopping_patience: 5
  early_stopping_threshold: 0.001

evaluation:
  batch_size: 12
  num_workers: 4
