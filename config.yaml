teacher:
  attention_dim: 768
  attention_heads: 12
  linear_units: 3072
  num_blocks: 12
  dropout_rate: 0.1
  attention_dropout_rate: 0.0
  cnn_module_kernel: 31

baseline:
  attention_dim: 768
  attention_heads: 12
  linear_units: 3072
  num_blocks: 6
  dropout_rate: 0.1
  attention_dropout_rate: 0.0
  cnn_module_kernel: 31

refiner:
  attention_dim: 512
  attention_heads: 8
  linear_units: 2048
  num_blocks: 1
  dropout_rate: 0.1
  attention_dropout_rate: 0.0

lora:
  enabled: true
  start_block: 0
  rank: 16
  alpha: 16
  dropout_rate: 0.05
  target_modules:
    - linear_q
    - linear_v

training:
  seed: 42
  batch_size: 4
  num_workers: 4
  gradient_accumulation_steps: 6
  learning_rate: 0.0001
  weight_decay: 0.005
  warmup_ratio: 0.05
  max_grad_norm: 5.0
  logging_steps: 25
  save_total_limit: 3
  early_stopping_patience: 5
  early_stopping_threshold: 0.001

evaluation:
  batch_size: 8
  num_workers: 4
