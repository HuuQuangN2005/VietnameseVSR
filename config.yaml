vsr:
  attention_dim: 768
  attention_heads: 12
  linear_units: 3072
  dropout_rate: 0.1
  attention_dropout_rate: 0.0
  cnn_module_kernel: 31

refiner:
  attention_dim: 512
  attention_heads: 8
  visual_dim: 512
  window_size: 3
  blank_id: 0
  k: 0
  blank_reduce: 0.5
  residual_scale: 0.1
  dropout_rate: 0.1
  attention_dropout_rate: 0.0

lora:
  start_block: 0
  rank: 16
  alpha: 16
  dropout_rate: 0.05
  target_modules:
    - linear_q
    - linear_v

training:
  seed: 42
  batch_size: 8
  num_workers: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  weight_decay: 0.005
  warmup_ratio: 0.05
  max_grad_norm: 5.0
  logging_steps: 25
  save_total_limit: 3
  early_stopping_patience: 5
  early_stopping_threshold: 0.001

evaluation:
  batch_size: 8
  num_workers: 1
