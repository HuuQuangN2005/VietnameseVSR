model:
  attention_dim: 256
  attention_heads: 4
  linear_units: 1024
  num_blocks: 4
  dropout_rate: 0.1
  attention_dropout_rate: 0.0
  cnn_module_kernel: 31

training:
  seed: 42
  batch_size: 2
  num_workers: 4
  gradient_accumulation_steps: 2
  learning_rate: 0.0001
  weight_decay: 0.005
  warmup_ratio: 0.05
  max_grad_norm: 5.0
  logging_steps: 25
  save_total_limit: 3

evaluation:
  batch_size: 2
  num_workers: 2
