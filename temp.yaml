training:
  seed: 42
  batch_size: 32
  num_workers: 16
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  weight_decay: 0.005
  warmup_steps: 0.05
  max_grad_norm: 5.0
  logging_steps: 25
  amp: true
  early_stopping_patience: 5
  early_stopping_threshold: 0.001

finetuning:
  seed: 42
  batch_size: 32
  num_workers: 16
  gradient_accumulation_steps: 1
  encoder_lr: 0.00002
  ctc_head_lr: 0.0001
  weight_decay: 0.005
  warmup_steps: 0.05
  max_grad_norm: 5.0
  logging_steps: 25
  amp: true
  early_stopping_patience: 5
  early_stopping_threshold: 0.001

evaluation:
  batch_size: 32
  num_workers: 16
  logging_steps: 25
  amp: true
